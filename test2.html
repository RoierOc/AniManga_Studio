<!DOCTYPE html>
<html>
<head>
    <script src="/static/js/vue.js"></script>
    <style>
        .test { color: red; }
    </style>
</head>
<body>
    <div id="app" class="test">{{ message }}</div>
    <script>
        console.log('Vue:', typeof Vue);
        console.log('createApp:', typeof Vue.createApp);
        var app = Vue.createApp({
            data() { return { message: 'HELLO VUE!' }; }
        });
        console.log('App:', app);
        app.mount('#app');
        console.log('Mounted');
    </script>
</body>
</html>
