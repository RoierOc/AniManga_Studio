[project]
name = "manga-upscaler"
version = "0.1.0"
description = "Manga image upscaler for real-time enhancement"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "spandrel>=0.4.2",
    "torch>=2.11.0",
]

[project.scripts]
manga-upscaler = "manga_upscaler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"