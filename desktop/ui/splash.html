<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AniManga Studio</title>
<style>
  /* Splash mínimo con la paleta "Midnight Atelier" del frontend */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #05070d; color: #dbe4f5;
    font: 500 1rem/1.4 system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .box { text-align: center; }
  .logo {
    font-size: 1.6rem; font-weight: 700; letter-spacing: .02em;
    background: linear-gradient(120deg, #6ea8ff, #8fd8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 1.25rem;
  }
  .ring {
    width: 2.4rem; height: 2.4rem; margin: 0 auto 1rem;
    border-radius: 50%;
    border: 3px solid rgba(110,168,255,.18);
    border-top-color: #6ea8ff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { color: #7d8db0; font-size: .85rem; min-height: 1.2em; }
  .err { color: #ff8f8f; }
  button {
    margin-top: 1rem; padding: .5rem 1.25rem; border-radius: .5rem;
    border: 1px solid rgba(110,168,255,.4); background: rgba(110,168,255,.12);
    color: #dbe4f5; font: inherit; cursor: pointer; display: none;
  }
  button:hover { background: rgba(110,168,255,.22); }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">AniManga Studio</div>
    <div class="ring" id="ring"></div>
    <div class="msg" id="msg">Iniciando el servidor…</div>
    <button id="retry" onclick="location.reload()">Reintentar</button>
  </div>
<script>
  // El shell Rust lanza el backend; aquí solo esperamos a que /health responda
  // y saltamos a la UI real (Flask sirve el SPA en el 5101, same-origin).
  const BASE = 'http://127.0.0.1:5101';
  const DEADLINE = Date.now() + 60_000;
  const msg = document.getElementById('msg');

  async function poll() {
    try {
      const r = await fetch(BASE + '/health', { cache: 'no-store' });
      if (r.ok) { location.replace(BASE + '/'); return; }
    } catch (_) {}
    if (Date.now() > DEADLINE) {
      document.getElementById('ring').style.display = 'none';
      msg.className = 'msg err';
      msg.textContent = 'El servidor no respondió en 60 s — revisa /tmp/manga_server.log';
      document.getElementById('retry').style.display = 'inline-block';
      return;
    }
    if (Date.now() % 10000 < 600) msg.textContent = 'Iniciando el servidor… (primer arranque tarda más)';
    setTimeout(poll, 500);
  }
  poll();
</script>
</body>
</html>
