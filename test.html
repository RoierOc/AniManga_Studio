<!DOCTYPE html>
<html>
<head>
    <script src="/static/js/vue.js"></script>
</head>
<body>
    <div id="app">
        <p>{{ message }}</p>
    </div>
    <script>
        var Vue_ref = Vue.ref;
        var message = Vue_ref('Hello Vue!');
        Vue.createApp({
            data: function() {
                return { message: 'Hello Vue!' };
            }
        }).mount('#app');
    </script>
</body>
</html>
