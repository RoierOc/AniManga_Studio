<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Biblioteca Manga</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d18;
      --bg-card: #14141f;
      --bg-hover: #1c1c2e;
      --accent: #6c9de0;
      --accent-dim: rgba(108,157,224,.15);
      --green: #48c78e;
      --text: #e8e8f0;
      --text-dim: #888899;
      --border: rgba(255,255,255,.07);
      --radius: 14px;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(13,13,24,.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px 12px;
      display: flex; align-items: center; gap: 12px;
    }
    .header-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, rgba(108,157,224,.25), rgba(108,157,224,.08));
      border: 1px solid rgba(108,157,224,.3);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--accent);
    }
    .header-info { flex: 1; min-width: 0; }
    .header-title { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
    .header-count { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
    .header-count strong { color: var(--accent); }
    .refresh-btn {
      width: 34px; height: 34px; background: none;
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s; flex-shrink: 0;
    }
    .refresh-btn:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .refresh-btn.spinning svg { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dl-all-btn {
      height: 34px; padding: 0 12px; background: rgba(72,199,142,.12);
      border: 1px solid rgba(72,199,142,.35); border-radius: 8px;
      color: var(--green); cursor: pointer; gap: 6px;
      display: none; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; white-space: nowrap;
      transition: all .15s; flex-shrink: 0; text-decoration: none;
    }
    .dl-all-btn:active { background: rgba(72,199,142,.25); transform: scale(.96); }
    .dl-all-btn.loading { opacity: .6; pointer-events: none; }
    .dl-all-btn.loading svg { animation: spin .7s linear infinite; }

    /* ── Main ── */
    .main { padding: 20px 16px 48px; max-width: 680px; margin: 0 auto; }

    /* ── Section label ── */
    .section-label {
      font-size: 10px; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .7px;
      margin: 0 0 10px;
    }
    .section-gap { margin-top: 24px; }

    /* ── Folder cards ── */
    .folder-card {
      background: var(--bg-card);
      border: 1px solid rgba(108,157,224,.18);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .folder-head {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: background .15s;
      user-select: none;
    }
    .folder-head:active { background: var(--bg-hover); }
    .folder-thumb {
      width: 46px; height: 58px; flex-shrink: 0;
      background: linear-gradient(160deg, rgba(108,157,224,.18), rgba(108,157,224,.05));
      border: 1px solid rgba(108,157,224,.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); position: relative; overflow: hidden;
    }
    .folder-thumb::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent); opacity: .6;
    }
    .folder-info { flex: 1; min-width: 0; }
    .folder-name {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 5px;
    }
    .folder-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .folder-count {
      font-size: 11px; color: #8fb8f0;
      background: rgba(108,157,224,.1); padding: 2px 8px; border-radius: 4px;
    }
    .folder-size { font-size: 11px; color: var(--text-dim); }
    .folder-actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .folder-toggle {
      width: 28px; height: 28px; border-radius: 7px;
      background: rgba(255,255,255,.05); border: 1px solid var(--border);
      color: var(--text-dim); display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .folder-toggle svg { transition: transform .2s; }
    .folder-toggle.open svg { transform: rotate(180deg); }
    .dl-btn {
      width: 38px; height: 38px;
      background: var(--accent-dim);
      border: 1px solid rgba(108,157,224,.28);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); cursor: pointer; text-decoration: none;
      transition: all .15s; flex-shrink: 0;
    }
    .dl-btn:active { background: rgba(108,157,224,.3); transform: scale(.93); }

    /* ── Folder file list ── */
    .folder-files {
      border-top: 1px solid var(--border);
      padding: 6px 0;
      display: none;
    }
    .folder-files.open { display: block; }
    .file-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px;
      border-bottom: 1px solid rgba(255,255,255,.03);
      transition: background .1s;
    }
    .file-row:last-child { border-bottom: none; }
    .file-row:active { background: var(--bg-hover); }
    .file-icon { color: rgba(108,157,224,.5); flex-shrink: 0; }
    .file-name {
      flex: 1; font-size: 12.5px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-size { font-size: 10.5px; color: var(--text-dim); flex-shrink: 0; }
    .file-dl {
      width: 30px; height: 30px; border-radius: 7px;
      background: var(--accent-dim); border: 1px solid rgba(108,157,224,.2);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
      text-decoration: none; flex-shrink: 0; transition: all .15s;
    }
    .file-dl:active { background: rgba(108,157,224,.3); transform: scale(.92); }

    /* ── Root files ── */
    .file-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 8px;
    }
    .file-card-thumb {
      width: 40px; height: 52px; flex-shrink: 0;
      background: rgba(255,255,255,.04); border: 1px solid var(--border);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim);
    }
    .file-card-info { flex: 1; min-width: 0; }
    .file-card-name {
      font-size: 13px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .file-card-meta { display: flex; gap: 6px; align-items: center; }
    .ext-badge {
      font-size: 9.5px; font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase; color: #8fb8f0;
      background: rgba(108,157,224,.1); padding: 2px 5px; border-radius: 3px;
    }

    /* ── Empty / skeleton ── */
    .empty {
      text-align: center; padding: 60px 20px; color: var(--text-dim);
    }
    .empty svg { opacity: .2; margin-bottom: 14px; }
    .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
    .empty p { font-size: 13px; line-height: 1.6; }
    .skeleton { animation: pulse 1.4s ease-in-out infinite; }
    .sk-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    }
    .sk-thumb { width: 46px; height: 58px; background: var(--bg-hover); border-radius: 8px; flex-shrink: 0; }
    .sk-lines { flex: 1; }
    .sk-line { height: 12px; background: var(--bg-hover); border-radius: 4px; margin-bottom: 8px; }
    .sk-line.short { width: 45%; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .footer { text-align: center; padding: 12px; font-size: 11px; color: var(--text-dim); opacity: .4; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-icon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/>
    </svg>
  </div>
  <div class="header-info">
    <div class="header-title">Biblioteca Manga</div>
    <div class="header-count" id="count-label">Cargando…</div>
  </div>
  <button class="dl-all-btn" id="dl-all-btn" title="Descargar toda la biblioteca como ZIP">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5v-2z"/></svg>
    Todo
  </button>
  <button class="refresh-btn" id="refresh-btn" title="Actualizar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    </svg>
  </button>
</header>

<main class="main" id="main">
  <div id="skeleton" class="skeleton">
    <div class="sk-card"><div class="sk-thumb"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
    <div class="sk-card"><div class="sk-thumb"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
  </div>
  <div id="content" style="display:none"></div>
  <div id="empty" class="empty" style="display:none">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/>
    </svg>
    <strong>Biblioteca vacía</strong>
    <p>Exporta un tomo desde la app y guárdalo en biblioteca para que aparezca aquí.</p>
  </div>
</main>

<div class="footer">Manga Upscaler · Red local</div>

<script>
const countLabel = document.getElementById('count-label');
const refreshBtn = document.getElementById('refresh-btn');
const dlAllBtn   = document.getElementById('dl-all-btn');
const skeleton  = document.getElementById('skeleton');
const content   = document.getElementById('content');
const empty     = document.getElementById('empty');

const FOLDER_ICON = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>`;
const FILE_ICON  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>`;
const DL_ICON_LG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5v-2z"/></svg>`;
const DL_ICON_SM = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5v-2z"/></svg>`;
const CHEV_ICON  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>`;

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderFolder(f) {
  const id = 'folder-' + f.name.replace(/[^a-z0-9]/gi, '_');
  const folderUrl = '/api/webdav/folder/' + encodeURIComponent(f.name);
  const filesHtml = f.files.map(fi => {
    const fileUrl = '/api/webdav/files/' + encodeURIComponent(f.name) + '/' + encodeURIComponent(fi.name);
    return `<div class="file-row">
      <span class="file-icon">${FILE_ICON}</span>
      <span class="file-name" title="${esc(fi.name)}">${esc(fi.name)}</span>
      <span class="file-size">${fi.size_mb} MB</span>
      <a class="file-dl" href="${fileUrl}" download="${esc(fi.name)}" title="Descargar">${DL_ICON_SM}</a>
    </div>`;
  }).join('');

  return `<div class="folder-card" id="${esc(id)}">
    <div class="folder-head" onclick="toggleFolder('${esc(id)}')">
      <div class="folder-thumb">${FOLDER_ICON}</div>
      <div class="folder-info">
        <div class="folder-name" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="folder-meta">
          <span class="folder-count">${f.count} tomo${f.count !== 1 ? 's' : ''}</span>
          <span class="folder-size">${f.total_mb} MB</span>
        </div>
      </div>
      <div class="folder-actions" onclick="event.stopPropagation()">
        <a class="dl-btn" href="${folderUrl}" download="${esc(f.name)}.zip" title="Descargar todo como ZIP">${DL_ICON_LG}</a>
        <div class="folder-toggle" id="${esc(id)}-toggle" title="Ver tomos">${CHEV_ICON}</div>
      </div>
    </div>
    <div class="folder-files" id="${esc(id)}-files">${filesHtml}</div>
  </div>`;
}

function renderRootFile(f) {
  const ext = f.name.split('.').pop().toUpperCase();
  const url = '/api/webdav/files/' + encodeURIComponent(f.name);
  return `<div class="file-card">
    <div class="file-card-thumb">${FILE_ICON}</div>
    <div class="file-card-info">
      <div class="file-card-name" title="${esc(f.name)}">${esc(f.name)}</div>
      <div class="file-card-meta">
        <span class="ext-badge">${ext}</span>
        <span class="file-size">${f.size_mb} MB</span>
      </div>
    </div>
    <a class="dl-btn" href="${url}" download="${esc(f.name)}" title="Descargar">${DL_ICON_LG}</a>
  </div>`;
}

function toggleFolder(id) {
  const files  = document.getElementById(id + '-files');
  const toggle = document.getElementById(id + '-toggle');
  if (!files) return;
  const open = files.classList.toggle('open');
  toggle.classList.toggle('open', open);
}

async function load() {
  refreshBtn.classList.add('spinning');
  try {
    const r = await fetch('/api/webdav/status');
    const d = await r.json();
    render(d.folders || [], d.files || []);
  } catch(e) {
    countLabel.textContent = 'Error al cargar';
  } finally {
    refreshBtn.classList.remove('spinning');
  }
}

function render(folders, files) {
  skeleton.style.display = 'none';
  const total = folders.length + files.length;

  if (!total) {
    countLabel.innerHTML = '<strong>0</strong> series';
    dlAllBtn.style.display = 'none';
    empty.style.display = '';
    return;
  }
  dlAllBtn.style.display = 'flex';

  const parts = [];
  if (folders.length) parts.push(`<strong>${folders.length}</strong> serie${folders.length!==1?'s':''}`);
  if (files.length)   parts.push(`<strong>${files.length}</strong> suelto${files.length!==1?'s':''}`);
  countLabel.innerHTML = parts.join(' · ');

  let html = '';
  if (folders.length) {
    html += `<div class="section-label">Series</div>`;
    html += folders.map(renderFolder).join('');
  }
  if (files.length) {
    html += `<div class="section-label${folders.length ? ' section-gap' : ''}">Archivos sueltos</div>`;
    html += files.map(renderRootFile).join('');
  }

  content.innerHTML = html;
  content.style.display = '';
  empty.style.display = 'none';
}

refreshBtn.addEventListener('click', load);

dlAllBtn.addEventListener('click', () => {
  dlAllBtn.classList.add('loading');
  dlAllBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg> Preparando…`;
  const a = document.createElement('a');
  a.href = '/api/webdav/all';
  a.download = 'Biblioteca_Manga.zip';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => {
    dlAllBtn.classList.remove('loading');
    dlAllBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5v-2z"/></svg> Todo`;
  }, 4000);
});

load();
</script>
</body>
</html>
