################################################################################
# Suwayomi-Server configuration
# Docs: https://github.com/Suwayomi/Suwayomi-Server/wiki/Configuring-Suwayomi-Server
################################################################################

# Network
server.ip = "127.0.0.1"
server.port = 4567

# Disable auto-open browser and system tray (headless/server mode)
server.initialOpenInBrowserEnabled = false
server.systemTrayEnabled = false

# WebUI (keep enabled — useful for managing extensions)
server.webUIEnabled = true
server.webUIFlavor = "WebUI"

# Data directory (downloads, extensions, database). Relative to wherever this
# config is loaded from — start.sh passes the actual path via -D flags
# (SUWAYOMI_DATA_DIR, default <repo>/suwayomi/data), which take precedence.
server.rootDir = "data"

# Extension repositories (Tachiyomi-compatible)
# El repo oficial suwayomi/tachiyomi-extension quedó VACÍO (dado de baja); el repo
# comunitario Keiyoushi es el estándar de facto que lo reemplazó (catálogo completo).
server.extensionRepos = [
  "https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"
]

# Downloads — let Flask handle the actual file storage
server.downloadAsCbz = false
